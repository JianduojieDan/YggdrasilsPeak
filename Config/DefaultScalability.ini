; Project scalability overrides (2026-11-14).
; Flat snow seen from eye height sits at a grazing angle (about 9 degrees at 10 m), where 4x anisotropic filtering
; blurs it along the view; rock faces facing the camera are not affected. 8x on High, 16x on Epic
; (Docs/Development/Snow_Diagnosis_2026-11-14.md, D5). Low and Medium keep the engine values.
[TextureQuality@2]
r.MaxAnisotropy=8

[TextureQuality@3]
r.MaxAnisotropy=16

; Lumen history (2026-11-19, play-test: dark/light bands on the shaded snow when turning the camera). Fewer accumulated
; frames and normal-based rejection let the screen-probe history at old frame edges fade faster.
[GlobalIlluminationQuality@2]
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=6
r.Lumen.ScreenProbeGather.Temporal.RejectBasedOnNormal=1

[GlobalIlluminationQuality@3]
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=6
r.Lumen.ScreenProbeGather.Temporal.RejectBasedOnNormal=1

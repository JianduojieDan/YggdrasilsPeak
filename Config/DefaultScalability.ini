; Project scalability overrides (2026-11-14).
; Flat snow seen from eye height sits at a grazing angle (about 9 degrees at 10 m), where 4x anisotropic filtering
; blurs it along the view; rock faces facing the camera are not affected. 8x on High, 16x on Epic
; (Docs/Development/Snow_Diagnosis_2026-11-14.md, D5). Low and Medium keep the engine values.
[TextureQuality@2]
r.MaxAnisotropy=8

[TextureQuality@3]
r.MaxAnisotropy=16
